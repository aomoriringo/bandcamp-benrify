name: release

# v0.1.0 のようなタグを push すると、単体 exe を作って GitHub の Releases に載せる
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "タグ ($env:GITHUB_REF_NAME) と Directory.Build.props のバージョン ($version) が違います"
          }

      - name: Test
        run: dotnet test tests/BandcampBenrify.Core.Tests -c Release

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/BandcampBenrify -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package Chrome extension
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath publish/BandcampBenrify-chrome-extension.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## 使い方

          **BandcampBenrify.exe** をダウンロードして、そのまま実行してください。インストールや .NET の準備は要りません (Windows 10 / 11、64 ビット)。

          - 初めて実行するとき「Windows によって PC が保護されました」と出ることがあります (署名していないため)。「詳細情報」→「実行」で起動できます
          - 設定・キュー・キャッシュは ``%LOCALAPPDATA%\BandcampBenrify`` に保存されます。新しい版にするときは exe を置き換えるだけで、そのまま引き継がれます
          - Chrome 拡張 (任意) を使う場合は **BandcampBenrify-chrome-extension.zip** を展開し、README の手順で読み込んでください
          "@
          gh release create $env:GITHUB_REF_NAME `
            publish/BandcampBenrify.exe publish/BandcampBenrify-chrome-extension.zip `
            --title "Bandcamp Benrify $env:GITHUB_REF_NAME" --notes $notes --generate-notes

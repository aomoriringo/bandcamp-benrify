<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Bandcamp Benrify</title>
  <style>
    body { font: 13px "Yu Gothic UI", "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 12px; color: #1f2933; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status { font-size: 12px; margin-bottom: 10px; }
    #status.ok { color: #1f7a3f; }
    #status.ng { color: #c53030; }
    #url { font-size: 11px; color: #5f6b76; word-break: break-all; margin-bottom: 10px; }
    button { display: block; width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #c9d1d8; border-radius: 4px; background: #f6f8fa; cursor: pointer; font: inherit; text-align: left; }
    button:hover:not(:disabled) { background: #e8f6fa; border-color: #1DA0C3; }
    button:disabled { color: #9aa5ae; cursor: default; }
    #result { margin-top: 10px; font-size: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <h1>Bandcamp Benrify</h1>
  <div id="status">アプリを確認中…</div>
  <div id="url"></div>
  <button id="enqueue" disabled>キューに追加</button>
  <div id="result"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
